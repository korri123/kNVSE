name: MSBuild

on:
  workflow_dispatch:
    # This makes the workflow only trigger manually

env:
  SOLUTION_FILE_PATH: nvse_plugin_example/nvse_plugin_example.sln
  PLATFORM_TOOLSET: v145

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[18.0,19.0)'
          msbuild-architecture: x64

      - name: Build Release
        working-directory: ${{ github.workspace }}
        run: >
          msbuild /m
          /p:Configuration=Release
          /p:PlatformToolset=${{ env.PLATFORM_TOOLSET }}
          /p:PostBuildEventUseInBuild=false
          ${{ env.SOLUTION_FILE_PATH }}

      - name: Build Debug
        working-directory: ${{ github.workspace }}
        run: >
          msbuild /m
          /p:Configuration=Debug
          /p:PlatformToolset=${{ env.PLATFORM_TOOLSET }}
          /p:PostBuildEventUseInBuild=false
          ${{ env.SOLUTION_FILE_PATH }}

      - name: Generate Timestamp
        shell: pwsh
        run: |
          "artifact_timestamp=$(Get-Date -Format 'yyyyMMddHHmmss')" >> $env:GITHUB_ENV

      - name: Package Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          Compress-Archive `
            -Path nvse_plugin_example\Release\kNVSE.dll, nvse_plugin_example\Release\kNVSE.pdb `
            -DestinationPath artifacts\kNVSE-Release-${{ env.artifact_timestamp }}.zip `
            -Force

          Compress-Archive `
            -Path nvse_plugin_example\Debug\kNVSE.dll, nvse_plugin_example\Debug\kNVSE.pdb `
            -DestinationPath artifacts\kNVSE-Debug-${{ env.artifact_timestamp }}.zip `
            -Force

      - name: Publish Zipped Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Zipped-Artifacts-${{ env.artifact_timestamp }}
          path: artifacts/

      - name: Delete old continuous release if exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view continuous *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete continuous --cleanup-tag --yes
          } else {
            Write-Host "No existing continuous release/tag to delete."
          }

      - name: Create continuous release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create continuous `
            artifacts/kNVSE-Release-${{ env.artifact_timestamp }}.zip `
            artifacts/kNVSE-Debug-${{ env.artifact_timestamp }}.zip `
            --title "Continuous release" `
            --notes "Continuous release generated from the latest push to development branch." `
            --prerelease `
            --target "${{ github.sha }}"
